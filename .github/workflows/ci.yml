name: Server CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: server-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run tests
        run: ./gradlew test --no-daemon

  postgres-auth:
    name: postgres-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: otp_test
          POSTGRES_USER: otp_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otp_test -d otp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Validate all required PostgreSQL regression suites
        env:
          ADMIN_EMAIL_LOGIN_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ADMIN_EMAIL_LOGIN_TEST_JDBC_USER: otp_test
          ADMIN_EMAIL_LOGIN_TEST_JDBC_PASSWORD: disposable-ci-password
          BIBLE_SEARCH_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          BIBLE_SEARCH_TEST_JDBC_USER: otp_test
          BIBLE_SEARCH_TEST_JDBC_PASSWORD: disposable-ci-password
          ACTIVITY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ACTIVITY_TEST_JDBC_USER: otp_test
          ACTIVITY_TEST_JDBC_PASSWORD: disposable-ci-password
          AI_HISTORY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          AI_HISTORY_TEST_JDBC_USER: otp_test
          AI_HISTORY_TEST_JDBC_PASSWORD: disposable-ci-password
          SCRIPTURE_COPY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          SCRIPTURE_COPY_TEST_JDBC_USER: otp_test
          SCRIPTURE_COPY_TEST_JDBC_PASSWORD: disposable-ci-password
          ACHIEVEMENT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ACHIEVEMENT_TEST_JDBC_USER: otp_test
          ACHIEVEMENT_TEST_JDBC_PASSWORD: disposable-ci-password
          DAILY_WORD_ROTATION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          DAILY_WORD_ROTATION_TEST_JDBC_USER: otp_test
          DAILY_WORD_ROTATION_TEST_JDBC_PASSWORD: disposable-ci-password
        run: >-
          ./gradlew test
          --tests '*AdminEmailLoginControllerTests'
          --tests '*BibleCursorSearchControllerTests'
          --tests '*ActivityCalendarControllerTests'
          --tests '*ReadingActivityIntegrationTests'
          --tests '*AiAnswerHistoryTests'
          --tests '*AiHistoryControllerTests'
          --tests '*AiContextSnapshotTests'
          --tests '*AiContextDeletionGuardPostgresTests'
          --tests '*ScriptureCopyControllerTests'
          --tests '*ScriptureCopyLegacyInsertPostgresTests'
          --tests '*AchievementControllerTests'
          --tests '*AchievementCatalogTests'
          --tests '*AchievementErasureGuardPostgresTests'
          --tests '*DailyWordRotation*PostgresTests'
          --rerun-tasks --no-daemon

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag mypasture-backend:ci .

  terraform-validation:
    name: terraform-${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap/state
          - bootstrap/github-actions
          - environments/staging
          - environments/prod

    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Check formatting
        run: terraform fmt -check -recursive ../../..

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate
