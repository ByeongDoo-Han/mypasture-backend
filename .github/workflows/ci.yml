name: Server CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: server-ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run tests
        run: ./gradlew test --no-daemon

  billing-postgres:
    name: billing-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing_test
          POSTGRES_PASSWORD: billing_test_only
          POSTGRES_DB: mypasture_billing_test
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U billing_test -d mypasture_billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Verify billing transactions and V42 migration
        run: ./gradlew billingPostgresTest --no-daemon

  container-build:
    name: container-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag mypasture-backend:ci .

  terraform-validation:
    name: terraform-${{ matrix.root }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root:
          - bootstrap/state
          - bootstrap/github-actions
          - environments/staging
          - environments/prod

    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Check formatting
        run: terraform fmt -check -recursive ../../..

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate
