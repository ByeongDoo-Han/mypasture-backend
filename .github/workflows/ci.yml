name: Server CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select affected checks
    runs-on: ubuntu-latest
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      run_unit: ${{ steps.select.outputs.run_unit }}
      run_postgres: ${{ steps.select.outputs.run_postgres }}
      run_container: ${{ steps.select.outputs.run_container }}
      run_terraform: ${{ steps.select.outputs.run_terraform }}
      terraform_roots: ${{ steps.select.outputs.terraform_roots }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test selection rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_select_tests.py'
      - name: Select from PR or push diff
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/changed-paths.txt"
            python3 .github/scripts/select_tests.py --paths-file "$RUNNER_TEMP/changed-paths.txt" --full > selection.json
          else
            base="${PR_BASE:-$PUSH_BEFORE}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              echo 'Cannot determine diff base' >&2
              exit 1
            fi
            git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths.txt"
            test -s "$RUNNER_TEMP/changed-paths.txt"
            python3 .github/scripts/select_tests.py --paths-file "$RUNNER_TEMP/changed-paths.txt" > selection.json
          fi
          cat selection.json >> "$GITHUB_STEP_SUMMARY"
          {
            echo "selection=$(cat selection.json)"
            echo "run_unit=$(jq -r '(.unit | length) > 0' selection.json)"
            echo "run_postgres=$(jq -r '(.postgres | length) > 0' selection.json)"
            echo "run_container=$(jq -r '.container' selection.json)"
            echo "run_terraform=$(jq -r '(.terraform_roots | length) > 0' selection.json)"
            echo "terraform_roots=$(jq -c '.terraform_roots' selection.json)"
          } >> "$GITHUB_OUTPUT"
      - name: Preserve selection for deployment gate
        uses: actions/upload-artifact@v7
        with:
          name: affected-checks
          path: selection.json
          retention-days: 7

  server-ci:
    name: server-ci
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        if: needs.changes.outputs.run_unit == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: needs.changes.outputs.run_unit == 'true'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Run tests
        if: needs.changes.outputs.run_unit == 'true'
        env:
          SELECTION: ${{ needs.changes.outputs.selection }}
        run: |
          mapfile -t filters < <(jq -r '.unit[]' <<< "$SELECTION")
          args=()
          for filter in "${filters[@]}"; do args+=(--tests "$filter"); done
          ./gradlew test "${args[@]}" --no-daemon
      - name: Record intentional skip
        if: needs.changes.outputs.run_unit != 'true'
        run: |
          echo 'Application tests skipped: no affected runtime code.' >> "$GITHUB_STEP_SUMMARY"

  postgres-auth:
    name: postgres-auth
    needs: changes
    if: needs.changes.outputs.run_postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: otp_test
          POSTGRES_USER: otp_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U otp_test -d otp_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Prepare PostgreSQL extensions in public schema
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U otp_test -d otp_test -c 'CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;'
          docker exec "$POSTGRES_CONTAINER" psql -U otp_test -d otp_test -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public;'
      - name: Validate all required PostgreSQL regression suites
        env:
          SELECTION: ${{ needs.changes.outputs.selection }}
          SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
          ADMIN_EMAIL_LOGIN_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ADMIN_EMAIL_LOGIN_TEST_JDBC_USER: otp_test
          ADMIN_EMAIL_LOGIN_TEST_JDBC_PASSWORD: disposable-ci-password
          BIBLE_SEARCH_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          BIBLE_SEARCH_TEST_JDBC_USER: otp_test
          BIBLE_SEARCH_TEST_JDBC_PASSWORD: disposable-ci-password
          COMMENTARY_PRELOAD_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          COMMENTARY_PRELOAD_TEST_JDBC_USER: otp_test
          COMMENTARY_PRELOAD_TEST_JDBC_PASSWORD: disposable-ci-password
          ACTIVITY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ACTIVITY_TEST_JDBC_USER: otp_test
          ACTIVITY_TEST_JDBC_PASSWORD: disposable-ci-password
          AI_HISTORY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          AI_HISTORY_TEST_JDBC_USER: otp_test
          AI_HISTORY_TEST_JDBC_PASSWORD: disposable-ci-password
          SCRIPTURE_COPY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          SCRIPTURE_COPY_TEST_JDBC_USER: otp_test
          SCRIPTURE_COPY_TEST_JDBC_PASSWORD: disposable-ci-password
          ACHIEVEMENT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          ACHIEVEMENT_TEST_JDBC_USER: otp_test
          ACHIEVEMENT_TEST_JDBC_PASSWORD: disposable-ci-password
          DAILY_WORD_ROTATION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          DAILY_WORD_ROTATION_TEST_JDBC_USER: otp_test
          DAILY_WORD_ROTATION_TEST_JDBC_PASSWORD: disposable-ci-password
          NICKNAME_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          NICKNAME_TEST_JDBC_USER: otp_test
          NICKNAME_TEST_JDBC_PASSWORD: disposable-ci-password
          QT_SHARED_QUESTION_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          QT_SHARED_QUESTION_TEST_JDBC_USER: otp_test
          QT_SHARED_QUESTION_TEST_JDBC_PASSWORD: disposable-ci-password
          AVATAR_PLATFORM_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          AVATAR_PLATFORM_TEST_JDBC_USER: otp_test
          AVATAR_PLATFORM_TEST_JDBC_PASSWORD: disposable-ci-password
          AVATAR_OUTFIT_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          AVATAR_OUTFIT_TEST_JDBC_USER: otp_test
          AVATAR_OUTFIT_TEST_JDBC_PASSWORD: disposable-ci-password
          AVATAR_OUTFIT_MIGRATION_JDBC_URL: jdbc:postgresql://localhost:5432/otp_test
          AVATAR_OUTFIT_MIGRATION_JDBC_USER: otp_test
          AVATAR_OUTFIT_MIGRATION_JDBC_PASSWORD: disposable-ci-password
        run: |
          mapfile -t filters < <(jq -r '.postgres[]' <<< "$SELECTION")
          args=()
          for filter in "${filters[@]}"; do args+=(--tests "$filter"); done
          ./gradlew test "${args[@]}" --rerun-tasks --no-daemon

  container-build:
    name: container-build
    needs: changes
    if: needs.changes.outputs.run_container == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build production image
        run: docker build --tag mypasture-backend:ci .

  terraform-validation:
    name: terraform-${{ matrix.root }}
    needs: changes
    if: needs.changes.outputs.run_terraform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.changes.outputs.terraform_roots) }}

    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Check formatting
        run: terraform fmt -check -recursive ../../..

      - name: Initialize without remote state
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate
