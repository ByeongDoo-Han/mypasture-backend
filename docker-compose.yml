services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mypasture-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mypasture}
      POSTGRES_USER: ${POSTGRES_USER:-mypasture}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypasture}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: mypasture-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mypasture-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mypasture}
      DATABASE_USERNAME: ${POSTGRES_USER:-mypasture}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-mypasture}
      DATABASE_DRIVER: org.postgresql.Driver
      JPA_DDL_AUTO: validate
      FLYWAY_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-test}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      OPENAI_GENERATOR_MODEL: ${OPENAI_GENERATOR_MODEL:-gpt-5.6-terra}
      OPENAI_EVALUATOR_MODEL: ${OPENAI_EVALUATOR_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_EVALUATOR_REASONING_EFFORT: ${OPENAI_EVALUATOR_REASONING_EFFORT:-medium}
      AI_EVALUATION_ENABLED: ${AI_EVALUATION_ENABLED:-true}
      AI_EVALUATION_THRESHOLD: ${AI_EVALUATION_THRESHOLD:-4}
      AI_EVALUATION_MAX_OUTPUT_TOKENS: ${AI_EVALUATION_MAX_OUTPUT_TOKENS:-250}
      AI_MAX_REVISION_COUNT: ${AI_MAX_REVISION_COUNT:-1}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_MOCK_ENABLED: ${AI_MOCK_ENABLED:-true}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-1536}
      AI_EMBEDDING_BATCH_SIZE: ${AI_EMBEDDING_BATCH_SIZE:-100}
      AI_EMBEDDING_INDEXING_ENABLED: ${AI_EMBEDDING_INDEXING_ENABLED:-false}
      AI_EMBEDDING_INDEX_POLL_DELAY_MS: ${AI_EMBEDDING_INDEX_POLL_DELAY_MS:-10000}
      AI_EMBEDDING_INPUT_COST_PER_MILLION: ${AI_EMBEDDING_INPUT_COST_PER_MILLION:-0.02}
      DAILY_WORD_GENERATION_ENABLED: ${DAILY_WORD_GENERATION_ENABLED:-false}
      DAILY_WORD_PROVIDER: ${DAILY_WORD_PROVIDER:-local}
      DAILY_WORD_GENERATION_CRON: ${DAILY_WORD_GENERATION_CRON:-0 0 18 * * *}
      DAILY_WORD_GENERATION_ZONE: ${DAILY_WORD_GENERATION_ZONE:-Asia/Seoul}
      DAILY_WORD_TARGET_DAYS_AHEAD: ${DAILY_WORD_TARGET_DAYS_AHEAD:-1}
      DAILY_WORD_LEASE_DURATION: ${DAILY_WORD_LEASE_DURATION:-2m}
      DAILY_WORD_MAX_ATTEMPTS: ${DAILY_WORD_MAX_ATTEMPTS:-3}
      DAILY_WORD_PROMPT_VERSION: ${DAILY_WORD_PROMPT_VERSION:-daily-word-v1}
      DAILY_WORD_MAX_OUTPUT_TOKENS: ${DAILY_WORD_MAX_OUTPUT_TOKENS:-500}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_LEASE_DURATION: ${NOTIFICATION_LEASE_DURATION:-2m}
      NOTIFICATION_INITIAL_BACKOFF: ${NOTIFICATION_INITIAL_BACKOFF:-30s}
      NOTIFICATION_MAX_BACKOFF: ${NOTIFICATION_MAX_BACKOFF:-1h}
      NOTIFICATION_SETTINGS_PAGE_SIZE: ${NOTIFICATION_SETTINGS_PAGE_SIZE:-500}
      NOTIFICATION_DISPATCH_BATCH_SIZE: ${NOTIFICATION_DISPATCH_BATCH_SIZE:-100}
      NOTIFICATION_MAX_BATCHES_PER_RUN: ${NOTIFICATION_MAX_BATCHES_PER_RUN:-20}
      AI_MAX_INPUT_CHARS: ${AI_MAX_INPUT_CHARS:-300}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-700}
      AI_FREE_DAILY_LIMIT: ${AI_FREE_DAILY_LIMIT:-10}
      AI_PREMIUM_DAILY_SAFETY_LIMIT: ${AI_PREMIUM_DAILY_SAFETY_LIMIT:-500}
      AI_PRIVACY_HASH_SECRET: ${AI_PRIVACY_HASH_SECRET:-local-ai-privacy-secret-change-me}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_STREAM_TIMEOUT_MS: ${AI_STREAM_TIMEOUT_MS:-60000}
      AI_STREAM_CORE_POOL_SIZE: ${AI_STREAM_CORE_POOL_SIZE:-8}
      AI_STREAM_MAX_POOL_SIZE: ${AI_STREAM_MAX_POOL_SIZE:-64}
      AI_STREAM_QUEUE_CAPACITY: ${AI_STREAM_QUEUE_CAPACITY:-200}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-86400}
      AI_RAG_TOP_K: ${AI_RAG_TOP_K:-10}
      AI_RAG_MIN_SIMILARITY: ${AI_RAG_MIN_SIMILARITY:-0.35}
      AI_RAG_LEXICAL_FALLBACK_ENABLED: ${AI_RAG_LEXICAL_FALLBACK_ENABLED:-true}
      AI_COMMENTARY_GENERATION_ENABLED: ${AI_COMMENTARY_GENERATION_ENABLED:-false}
      AI_COMMENTARY_POLL_DELAY_MS: ${AI_COMMENTARY_POLL_DELAY_MS:-5000}
      AI_COMMENTARY_PROMPT_VERSION: ${AI_COMMENTARY_PROMPT_VERSION:-chapter-commentary-v1}
      AI_COMMENTARY_MAX_OUTPUT_TOKENS: ${AI_COMMENTARY_MAX_OUTPUT_TOKENS:-1800}
      AI_COMMENTARY_INPUT_COST_PER_MILLION: ${AI_COMMENTARY_INPUT_COST_PER_MILLION:-0.25}
      AI_COMMENTARY_OUTPUT_COST_PER_MILLION: ${AI_COMMENTARY_OUTPUT_COST_PER_MILLION:-2.00}
      JWT_ISSUER: ${JWT_ISSUER:-mypasture-local}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-change-me-32-bytes-minimum}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-mypasture://password-reset}
      PASSWORD_RESET_DELIVERY: ${PASSWORD_RESET_DELIVERY:-log}
      PASSWORD_RESET_FROM: ${PASSWORD_RESET_FROM:-no-reply@mypasture.app}
      QUIET_TIME_DEFAULT_MEETING_DURATION_MINUTES: ${QUIET_TIME_DEFAULT_MEETING_DURATION_MINUTES:-120}
      QUIET_TIME_QR_EXPIRY_GRACE_MINUTES: ${QUIET_TIME_QR_EXPIRY_GRACE_MINUTES:-30}
      QUIET_TIME_INVITE_BASE_URL: ${QUIET_TIME_INVITE_BASE_URL:-https://mypasture.app/q/qt}
      # 호스트의 local 경로와 분리해 컨테이너 내부 mount 경로를 사용합니다.
      KOR1910_HTML_PATH: /app/data/kor_html
      BIBLE_IMPORT_ENABLED: ${BIBLE_IMPORT_ENABLED:-true}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      GOOGLE_OAUTH_WEB_CLIENT_IDS: ${GOOGLE_OAUTH_WEB_CLIENT_IDS:-}
      GOOGLE_OAUTH_IOS_CLIENT_IDS: ${GOOGLE_OAUTH_IOS_CLIENT_IDS:-}
      GOOGLE_OAUTH_ANDROID_CLIENT_IDS: ${GOOGLE_OAUTH_ANDROID_CLIENT_IDS:-}
      APPLE_OAUTH_CLIENT_IDS: ${APPLE_OAUTH_CLIENT_IDS:-}
      KAKAO_USER_INFO_URI: ${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}
      KAKAO_TOKEN_INFO_URI: ${KAKAO_TOKEN_INFO_URI:-https://kapi.kakao.com/v1/user/access_token_info}
      KAKAO_APP_IDS: ${KAKAO_APP_IDS:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - ./data/kor_html:/app/data/kor_html:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: mypasture-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:
