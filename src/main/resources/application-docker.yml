spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/mypasture}
    username: ${DATABASE_USERNAME:mypasture}
    password: ${DATABASE_PASSWORD:mypasture}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

app:
  bible:
    kor1910-html-path: ${KOR1910_HTML_PATH:/app/data/kor_html}
  ai:
    api-key: ${OPENAI_API_KEY:test}
    mock-enabled: ${AI_MOCK_ENABLED:true}
  security:
    jwt:
      issuer: ${JWT_ISSUER:mypasture-docker}
      secret: ${JWT_SECRET:local-docker-jwt-secret-change-me-32-bytes-min}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
