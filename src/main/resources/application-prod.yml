spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  config:
    activate:
      on-profile: prod
    # 로컬 운영 검증용이며, 실제 배포 환경변수가 있으면 그 값이 우선합니다.
    import: optional:file:.env.prod[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}

server:
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  auth:
    email-verification:
      required: true
      delivery: ${EMAIL_VERIFICATION_DELIVERY:smtp}
      from: ${EMAIL_VERIFICATION_FROM}
      hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET}
    password-reset:
      delivery: ${PASSWORD_RESET_DELIVERY:smtp}
      reset-url: ${PASSWORD_RESET_URL}
      from: ${PASSWORD_RESET_FROM}
  bible:
    kor1910-html-path: ${KOR1910_HTML_PATH}
    import-enabled: ${BIBLE_IMPORT_ENABLED:false}
  daily-word:
    generation-enabled: ${DAILY_WORD_GENERATION_ENABLED:true}
    provider: ${DAILY_WORD_PROVIDER:openai}
    incident-detection-enabled: ${DAILY_WORD_INCIDENT_DETECTION_ENABLED:true}
    incident-email-delivery: ${DAILY_WORD_INCIDENT_EMAIL_DELIVERY:smtp}
    incident-email-from: ${DAILY_WORD_INCIDENT_EMAIL_FROM}
  quiet-time:
    realtime:
      redis-enabled: ${QUIET_TIME_REALTIME_REDIS_ENABLED:true}
  ai:
    api-key: ${OPENAI_API_KEY}
    privacy-hash-secret: ${AI_PRIVACY_HASH_SECRET}
    embedding-indexing-enabled: ${AI_EMBEDDING_INDEXING_ENABLED:false}
    rag-lexical-fallback-enabled: ${AI_RAG_LEXICAL_FALLBACK_ENABLED:false}
  security:
    rate-limit:
      enabled: true
      fail-closed: true
      trust-forwarded-headers: true
    jwt:
      issuer: ${JWT_ISSUER:mypasture}
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
      refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
