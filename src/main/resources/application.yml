spring:
  application:
    name: mypasture
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    timeout-per-shutdown-phase: 9s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  billing:
    enabled: ${BILLING_ENABLED:false}
    environment: ${BILLING_ENVIRONMENT:SANDBOX}
    encryption-key: ${BILLING_ENCRYPTION_KEY:}
    apple:
      enabled: ${BILLING_APPLE_ENABLED:false}
      bundle-id: ${BILLING_APPLE_BUNDLE_ID:}
      app-apple-id: ${BILLING_APPLE_APP_ID:}
      issuer-id: ${BILLING_APPLE_ISSUER_ID:}
      key-id: ${BILLING_APPLE_KEY_ID:}
      private-key-path: ${BILLING_APPLE_PRIVATE_KEY_PATH:}
      root-certificate-paths: ${BILLING_APPLE_ROOT_CERTIFICATE_PATHS:}
      monthly-product-id: ${BILLING_APPLE_MONTHLY_PRODUCT_ID:}
      yearly-product-id: ${BILLING_APPLE_YEARLY_PRODUCT_ID:}
      deep-product-id: ${BILLING_APPLE_DEEP_PRODUCT_ID:}
    google:
      enabled: ${BILLING_GOOGLE_ENABLED:false}
      package-name: ${BILLING_GOOGLE_PACKAGE_NAME:}
      push-audience: ${BILLING_GOOGLE_PUSH_AUDIENCE:}
      push-service-account: ${BILLING_GOOGLE_PUSH_SERVICE_ACCOUNT:}
      monthly-product-id: ${BILLING_GOOGLE_MONTHLY_PRODUCT_ID:}
      yearly-product-id: ${BILLING_GOOGLE_YEARLY_PRODUCT_ID:}
      deep-product-id: ${BILLING_GOOGLE_DEEP_PRODUCT_ID:}
  policy:
    enforcement-enabled: ${POLICY_CONSENT_ENFORCED:true}
  worker:
    enabled: ${APP_WORKER_ENABLED:false}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  security:
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:false}
      fail-closed: ${RATE_LIMIT_FAIL_CLOSED:false}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
      auth-requests-per-window: ${AUTH_RATE_LIMIT_PER_WINDOW:20}
      ai-requests-per-window: ${AI_RATE_LIMIT_PER_WINDOW:15}
      quiet-time-join-code-requests-per-window: ${QUIET_TIME_JOIN_CODE_RATE_LIMIT_PER_WINDOW:12}
      coupon-redeem-requests-per-window: ${COUPON_REDEEM_RATE_LIMIT_PER_WINDOW:8}
  coupon:
    code-pepper: ${COUPON_CODE_PEPPER:local-coupon-code-pepper-change-me}
  auth:
    admin-email-login:
      enabled: ${ADMIN_EMAIL_LOGIN_ENABLED:false}
      hmac-secret: ${ADMIN_EMAIL_LOGIN_HMAC_SECRET:}
      from: ${ADMIN_EMAIL_LOGIN_FROM:no-reply@mypasture.app}
    email-verification:
      required: ${EMAIL_VERIFICATION_REQUIRED:true}
      code-ttl-minutes: ${EMAIL_VERIFICATION_CODE_TTL_MINUTES:10}
      signup-token-ttl-minutes: ${EMAIL_VERIFICATION_SIGNUP_TOKEN_TTL_MINUTES:30}
      request-cooldown-seconds: ${EMAIL_VERIFICATION_REQUEST_COOLDOWN_SECONDS:60}
      max-attempts: ${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
      delivery: ${EMAIL_VERIFICATION_DELIVERY:log}
      from: ${EMAIL_VERIFICATION_FROM:no-reply@mypasture.app}
      hmac-secret: ${EMAIL_VERIFICATION_HMAC_SECRET:local-email-verification-secret-change-me}
    password-reset:
      token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
      request-cooldown-seconds: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
      reset-url: ${PASSWORD_RESET_URL:mypasture://password-reset}
      delivery: ${PASSWORD_RESET_DELIVERY:log}
      from: ${PASSWORD_RESET_FROM:no-reply@mypasture.app}
  firebase:
    enabled: ${FIREBASE_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  notification:
    delivery:
      max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}
      lease-duration: ${NOTIFICATION_LEASE_DURATION:2m}
      initial-backoff: ${NOTIFICATION_INITIAL_BACKOFF:30s}
      max-backoff: ${NOTIFICATION_MAX_BACKOFF:1h}
      settings-page-size: ${NOTIFICATION_SETTINGS_PAGE_SIZE:500}
      dispatch-batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:100}
      max-batches-per-run: ${NOTIFICATION_MAX_BATCHES_PER_RUN:20}
  daily-word:
    generation-enabled: ${DAILY_WORD_GENERATION_ENABLED:false}
    provider: ${DAILY_WORD_PROVIDER:disabled}
    generation-cron: ${DAILY_WORD_GENERATION_CRON:0 0 18 * * *}
    generation-zone: ${DAILY_WORD_GENERATION_ZONE:Asia/Seoul}
    target-days-ahead: ${DAILY_WORD_TARGET_DAYS_AHEAD:1}
    poll-delay-ms: ${DAILY_WORD_POLL_DELAY_MS:5000}
    lease-duration: ${DAILY_WORD_LEASE_DURATION:2m}
    max-attempts: ${DAILY_WORD_MAX_ATTEMPTS:3}
    prompt-version: ${DAILY_WORD_PROMPT_VERSION:daily-word-v1}
    max-output-tokens: ${DAILY_WORD_MAX_OUTPUT_TOKENS:500}
    incident-detection-enabled: ${DAILY_WORD_INCIDENT_DETECTION_ENABLED:false}
    incident-detection-cron: ${DAILY_WORD_INCIDENT_DETECTION_CRON:0 */10 * * * *}
    incident-warning-time: ${DAILY_WORD_INCIDENT_WARNING_TIME:20:00}
    incident-critical-time: ${DAILY_WORD_INCIDENT_CRITICAL_TIME:22:00}
    incident-stalled-threshold: ${DAILY_WORD_INCIDENT_STALLED_THRESHOLD:10m}
    incident-email-delivery: ${DAILY_WORD_INCIDENT_EMAIL_DELIVERY:log}
    incident-email-from: ${DAILY_WORD_INCIDENT_EMAIL_FROM:no-reply@mypasture.app}
    incident-email-poll-delay-ms: ${DAILY_WORD_INCIDENT_EMAIL_POLL_DELAY_MS:30000}
    incident-email-lease-duration: ${DAILY_WORD_INCIDENT_EMAIL_LEASE_DURATION:2m}
    incident-email-retry-delay: ${DAILY_WORD_INCIDENT_EMAIL_RETRY_DELAY:5m}
    incident-email-max-attempts: ${DAILY_WORD_INCIDENT_EMAIL_MAX_ATTEMPTS:5}
    incident-email-batch-size: ${DAILY_WORD_INCIDENT_EMAIL_BATCH_SIZE:20}
  quiet-time:
    qr:
      default-meeting-duration-minutes: ${QUIET_TIME_DEFAULT_MEETING_DURATION_MINUTES:120}
      expiry-grace-minutes: ${QUIET_TIME_QR_EXPIRY_GRACE_MINUTES:30}
      invite-base-url: ${QUIET_TIME_INVITE_BASE_URL:https://mypasture.app/q/qt}
    realtime:
      redis-enabled: ${QUIET_TIME_REALTIME_REDIS_ENABLED:false}
      sse-timeout-ms: ${QUIET_TIME_SSE_TIMEOUT_MS:1800000}
      heartbeat-delay-ms: ${QUIET_TIME_SSE_HEARTBEAT_DELAY_MS:15000}
  ai:
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    generator-model: ${OPENAI_GENERATOR_MODEL:${OPENAI_MODEL:gpt-5.6-terra}}
    evaluator-model: ${OPENAI_EVALUATOR_MODEL:gpt-5.6-luna}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    embedding-batch-size: ${AI_EMBEDDING_BATCH_SIZE:100}
    embedding-indexing-enabled: ${AI_EMBEDDING_INDEXING_ENABLED:false}
    embedding-index-poll-delay-ms: ${AI_EMBEDDING_INDEX_POLL_DELAY_MS:10000}
    embedding-backfill-enabled: ${AI_EMBEDDING_BACKFILL_ENABLED:false}
    embedding-backfill-max-batches: ${AI_EMBEDDING_BACKFILL_MAX_BATCHES:1000}
    embedding-backfill-delay-ms: ${AI_EMBEDDING_BACKFILL_DELAY_MS:100}
    embedding-response-max-bytes: ${AI_EMBEDDING_RESPONSE_MAX_BYTES:16777216}
    embedding-input-cost-per-million: ${AI_EMBEDDING_INPUT_COST_PER_MILLION:0.02}
    api-key: ${OPENAI_API_KEY:test}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    max-input-chars: ${AI_MAX_INPUT_CHARS:300}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:700}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    evaluator-reasoning-effort: ${OPENAI_EVALUATOR_REASONING_EFFORT:none}
    evaluation-enabled: ${AI_EVALUATION_ENABLED:true}
    evaluation-threshold: ${AI_EVALUATION_THRESHOLD:4}
    evaluation-max-output-tokens: ${AI_EVALUATION_MAX_OUTPUT_TOKENS:500}
    max-revision-count: ${AI_MAX_REVISION_COUNT:1}
    free-daily-limit: ${AI_FREE_DAILY_LIMIT:10}
    premium-daily-safety-limit: ${AI_PREMIUM_DAILY_SAFETY_LIMIT:500}
    privacy-hash-secret: ${AI_PRIVACY_HASH_SECRET:local-ai-privacy-secret-change-me}
    timeout-ms: ${AI_TIMEOUT_MS:12000}
    stream-timeout-ms: ${AI_STREAM_TIMEOUT_MS:60000}
    stream-core-pool-size: ${AI_STREAM_CORE_POOL_SIZE:8}
    stream-max-pool-size: ${AI_STREAM_MAX_POOL_SIZE:64}
    stream-queue-capacity: ${AI_STREAM_QUEUE_CAPACITY:200}
    idempotency-response-ttl-seconds: ${AI_IDEMPOTENCY_RESPONSE_TTL_SECONDS:86400}
    idempotency-receipt-retention-days: ${AI_IDEMPOTENCY_RECEIPT_RETENTION_DAYS:30}
    idempotency-pending-timeout-ms: ${AI_IDEMPOTENCY_PENDING_TIMEOUT_MS:120000}
    cache-ttl-seconds: ${AI_CACHE_TTL_SECONDS:86400}
    rag-top-k: ${AI_RAG_TOP_K:10}
    rag-min-similarity: ${AI_RAG_MIN_SIMILARITY:0.35}
    rag-lexical-fallback-enabled: ${AI_RAG_LEXICAL_FALLBACK_ENABLED:true}
    commentary-generation-enabled: ${AI_COMMENTARY_GENERATION_ENABLED:false}
    commentary-poll-delay-ms: ${AI_COMMENTARY_POLL_DELAY_MS:5000}
    commentary-prompt-version: ${AI_COMMENTARY_PROMPT_VERSION:chapter-commentary-v1}
    commentary-max-output-tokens: ${AI_COMMENTARY_MAX_OUTPUT_TOKENS:1800}
    commentary-input-cost-per-million: ${AI_COMMENTARY_INPUT_COST_PER_MILLION:0.25}
    commentary-output-cost-per-million: ${AI_COMMENTARY_OUTPUT_COST_PER_MILLION:2.00}

  oauth:
    challenge-ttl-seconds: ${SOCIAL_LOGIN_CHALLENGE_TTL_SECONDS:300}
    connect-timeout-ms: ${SOCIAL_OAUTH_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${SOCIAL_OAUTH_READ_TIMEOUT_MS:5000}
    google:
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:${GOOGLE_OAUTH_CLIENT_ID:}}
      web-client-ids: ${GOOGLE_OAUTH_WEB_CLIENT_IDS:}
      ios-client-ids: ${GOOGLE_OAUTH_IOS_CLIENT_IDS:}
      android-client-ids: ${GOOGLE_OAUTH_ANDROID_CLIENT_IDS:}
      issuer: ${GOOGLE_OAUTH_ISSUER:https://accounts.google.com}
      jwk-set-uri: ${GOOGLE_OAUTH_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    apple:
      client-ids: ${APPLE_OAUTH_CLIENT_IDS:${APPLE_OAUTH_CLIENT_ID:}}
      issuer: ${APPLE_OAUTH_ISSUER:https://appleid.apple.com}
      jwk-set-uri: ${APPLE_OAUTH_JWK_SET_URI:https://appleid.apple.com/auth/keys}
    kakao:
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      token-info-uri: ${KAKAO_TOKEN_INFO_URI:https://kapi.kakao.com/v1/user/access_token_info}
      app-ids: ${KAKAO_APP_IDS:}
