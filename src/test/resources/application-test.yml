spring:
  datasource:
    url: jdbc:h2:mem:mypasture;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  cors:
    allowed-origins:
      - http://localhost:8084
      - http://localhost:3000
    web-session-allowed-origins:
      - http://localhost:8084
      - http://localhost:3000
  worker:
    enabled: false
  firebase:
    enabled: false
  bible:
    kor1910-html-path: src/test/resources/bible/kor_html
    import-enabled: false
  ai:
    api-key: test
    mock-enabled: true
  daily-word:
    rotation-enabled: false
    generation-enabled: false
    incident-detection-enabled: false
  security:
    rate-limit:
      enabled: false
    jwt:
      issuer: mypasture-test
      secret: test-jwt-secret-isolated-from-local-config
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
